<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Capítulos — Modo Avião Admin</title>
    <th:block th:replace="~{admin/fragments/style :: style}"></th:block>
</head>
<body>
<header class="topbar">
    <h1>Capítulos</h1>
    <div class="topbar-actions">
        <a class="btn btn-secondary" th:href="@{/admin/quiz}">Quiz</a>
        <a class="btn btn-primary" th:href="@{/admin/capitulos/novo}">＋ Novo Capítulo</a>
        <form method="post" th:action="@{/admin/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary">Sair</button>
        </form>
    </div>
</header>

<main>
    <p class="mensagem-vazia" th:if="${#lists.isEmpty(capitulos)}">
        Nenhum capítulo cadastrado. Clique em Novo Capítulo para começar.
    </p>

    <table class="tabela" th:unless="${#lists.isEmpty(capitulos)}">
        <thead>
        <tr>
            <th>Ordem</th>
            <th>Slug</th>
            <th>Parte</th>
            <th>Título</th>
            <th>Checkpoint</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="capitulo : ${capitulos}">
            <td th:text="${capitulo.ordem}"></td>
            <td th:text="${capitulo.slug}"></td>
            <td th:text="${capitulo.parte}"></td>
            <td th:text="${capitulo.titulo}"></td>
            <td th:text="${temCheckpoint[capitulo.id]} ? 'Sim' : 'Não'"></td>
            <td><a th:href="@{/admin/capitulos/{id}/editar(id=${capitulo.id})}">Editar</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
