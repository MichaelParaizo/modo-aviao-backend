<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Resultado — ' + ${resultadoForm.modo}">Resultado</title>
    <th:block th:replace="~{admin/fragments/style :: style}"></th:block>
</head>
<body>
<header class="topbar">
    <h1 th:text="'Resultado — ' + ${resultadoForm.modo}">Resultado</h1>
</header>

<main>
    <form method="post" th:action="@{/admin/quiz/resultado/salvar}" th:object="${resultadoForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{modo}"/>

        <label for="titulo">Título</label>
        <input type="text" id="titulo" th:field="*{titulo}" required>

        <label for="emoji">Emoji</label>
        <input type="text" id="emoji" th:field="*{emoji}">

        <label for="texto">Texto de resultado</label>
        <textarea id="texto" th:field="*{texto}" class="textarea-grande"></textarea>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/admin/quiz}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
