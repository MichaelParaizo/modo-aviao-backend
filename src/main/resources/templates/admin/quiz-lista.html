<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Diagnóstico — Modo Avião Admin</title>
    <th:block th:replace="~{admin/fragments/style :: style}"></th:block>
</head>
<body>
<header class="topbar">
    <h1>Quiz Diagnóstico</h1>
    <div class="topbar-actions">
        <a class="btn btn-secondary" th:href="@{/admin}">Capítulos</a>
        <a class="btn btn-primary" th:href="@{/admin/quiz/pergunta/nova}">＋ Nova Pergunta</a>
        <form method="post" th:action="@{/admin/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary">Sair</button>
        </form>
    </div>
</header>

<main>
    <h2>Perguntas</h2>

    <p class="mensagem-vazia" th:if="${#lists.isEmpty(perguntas)}">
        Nenhuma pergunta cadastrada. Clique em Nova Pergunta para começar.
    </p>

    <table class="tabela" th:unless="${#lists.isEmpty(perguntas)}">
        <thead>
        <tr>
            <th>Ordem</th>
            <th>Enunciado</th>
            <th>Opções</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pergunta : ${perguntas}">
            <td th:text="${pergunta.ordem}"></td>
            <td th:text="${pergunta.enunciado}"></td>
            <td th:text="${quantidadeOpcoes[pergunta.id]}"></td>
            <td><a th:href="@{/admin/quiz/pergunta/{id}/editar(id=${pergunta.id})}">Editar</a></td>
            <td>
                <form method="post" th:action="@{/admin/quiz/pergunta/{id}/excluir(id=${pergunta.id})}"
                      onsubmit="return confirm('Excluir esta pergunta e todas as suas opções?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Resultados</h2>
    <p class="hint">Cada um dos 4 modos de fuga precisa de um texto de resultado.</p>

    <table class="tabela">
        <thead>
        <tr>
            <th>Modo</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="modo : ${modos}">
            <td th:text="${modo}"></td>
            <td th:text="${resultadosPorModo.containsKey(modo)} ? 'Cadastrado' : 'Não cadastrado'"></td>
            <td><a th:href="@{/admin/quiz/resultado/{modo}/editar(modo=${modo})}">Editar</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
