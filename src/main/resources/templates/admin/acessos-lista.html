<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acessos — Modo Avião Admin</title>
    <th:block th:replace="~{admin/fragments/style :: style}"></th:block>
</head>
<body>
<header class="topbar">
    <h1>Acessos</h1>
    <div class="topbar-actions">
        <a class="btn btn-secondary" th:href="@{/admin}">Capítulos</a>
        <a class="btn btn-secondary" th:href="@{/admin/quiz}">Quiz</a>
        <form method="post" th:action="@{/admin/logout}" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-secondary">Sair</button>
        </form>
    </div>
</header>

<main>
    <p class="hint">
        Só e-mails desta lista conseguem criar conta no app (o cadastro verifica isso). Adicione aqui o
        e-mail de quem já pagou. O login de contas já existentes não é afetado por esta lista.
    </p>

    <form method="post" th:action="@{/admin/acessos/adicionar}" style="margin-top:16px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label for="email">Adicionar e-mail autorizado</label>
        <input type="text" id="email" name="email" placeholder="nome@exemplo.com" required>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Adicionar</button>
        </div>
    </form>

    <p class="mensagem-vazia" th:if="${#lists.isEmpty(emails)}">
        Nenhum e-mail autorizado ainda.
    </p>

    <table class="tabela" th:unless="${#lists.isEmpty(emails)}">
        <thead>
        <tr>
            <th>Email</th>
            <th>Origem</th>
            <th>Liberado em</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="autorizado : ${emails}">
            <td th:text="${autorizado.email}"></td>
            <td th:text="${autorizado.origem}"></td>
            <td th:text="${#temporals.format(autorizado.liberadoEm, 'dd/MM/yyyy HH:mm')}"></td>
            <td>
                <form method="post" th:action="@{/admin/acessos/remover}"
                      onsubmit="return confirm('Remover o acesso deste e-mail?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="email" th:value="${autorizado.email}"/>
                    <button type="submit" class="btn btn-secondary">Remover</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
