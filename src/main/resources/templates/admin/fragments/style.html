<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="style">
<style>
    :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --border: #d9dce1;
        --text: #1f2430;
        --text-muted: #5c6270;
        --accent: #2f6fed;
        --accent-hover: #234fb8;
        --danger: #c0392b;
        --danger-bg: #fdecea;
    }

    * { box-sizing: border-box; }

    body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
    }

    main {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
    }

    h1 {
        font-size: 1.5rem;
        margin: 0;
    }

    a {
        color: var(--accent);
    }

    label {
        display: block;
        font-weight: 600;
        margin: 16px 0 4px;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 1rem;
        font-family: inherit;
        background: var(--surface);
        color: var(--text);
    }

    textarea {
        resize: vertical;
    }

    textarea.textarea-grande {
        min-height: 420px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .btn {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
    }

    .btn-primary {
        background: var(--accent);
        color: #fff;
    }

    .btn-primary:hover {
        background: var(--accent-hover);
    }

    .btn-secondary {
        background: var(--surface);
        color: var(--text);
        border-color: var(--border);
    }

    .btn-secondary:hover {
        background: var(--bg);
    }

    /* Login */
    .login-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    .login-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 32px;
        width: 100%;
        max-width: 360px;
    }

    .login-box h1 {
        margin-bottom: 8px;
        font-size: 1.25rem;
    }

    .login-box button {
        width: 100%;
        margin-top: 20px;
    }

    .alert-error {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid var(--danger);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 0.9rem;
    }

    /* Topbar */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 24px 0;
    }

    .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .logout-form {
        display: inline;
    }

    /* Tabela */
    .tabela {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }

    .tabela th,
    .tabela td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
    }

    .tabela th {
        background: var(--bg);
        font-size: 0.85rem;
        text-transform: uppercase;
        color: var(--text-muted);
    }

    .tabela tr:last-child td {
        border-bottom: none;
    }

    .mensagem-vazia {
        margin-top: 20px;
        color: var(--text-muted);
    }

    /* Formulário de capítulo */
    fieldset.checkpoint-section {
        margin-top: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 20px 20px;
        background: var(--surface);
    }

    fieldset.checkpoint-section legend {
        font-weight: 700;
        padding: 0 6px;
    }

    .hint {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin: 4px 0 0;
    }

    .form-actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
    }
</style>
</th:block>
