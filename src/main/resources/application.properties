spring.config.import=optional:classpath:application-local.properties

spring.application.name=modoaviao-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modoaviao}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:8083}

brevo.api-key=${BREVO_API_KEY:}

hotmart.hottok=${HOTMART_HOTTOK:}